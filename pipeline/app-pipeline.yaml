AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CI/CD for atx-sample-orders-api. Push to main -> test/package -> deploy dev -> manual approval -> deploy prod.
  Pull requests to main -> CodeBuild validation (tests, cfn-lint, ATX plan guard) reported to GitHub as a status check.
  GitHub access uses the existing CodeConnections (CodeStar) connection; no PAT.

Parameters:
  ConnectionArn:
    Type: String
    Description: ARN of the AVAILABLE CodeConnections GitHub connection
  RepositoryId:
    Type: String
    Description: owner/name of the app repo, e.g. my-org/atx-sample-orders-api
  BranchName:
    Type: String
    Default: main
  AppStackPrefix:
    Type: String
    Default: atx-sample-orders-api
    AllowedPattern: "[a-z][a-z0-9-]{2,30}"
  AtxFactoryBucket:
    Type: String
    Description: ArtifactBucketName output of the factory stack (tools zip + plans)
  AtxBranchRegex:
    Type: String
    Default: "^atx/"
    Description: Branches treated as ATX branches by the PR guard
  CodeBuildImage:
    Type: String
    Default: aws/codebuild/standard:7.0

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AppStackPrefix}-*"
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket]
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: AtxFactoryReadOnly
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${AtxFactoryBucket}/tools/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${AtxFactoryBucket}/plans/${RepositoryId}/*"
              - Sid: UseGitHubConnection
                Effect: Allow
                Action:
                  - codeconnections:GetConnectionToken
                  - codeconnections:GetConnection
                  - codeconnections:UseConnection
                  - codestar-connections:GetConnectionToken
                  - codestar-connections:GetConnection
                  - codestar-connections:UseConnection
                Resource: !Ref ConnectionArn

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AppStackPrefix}-build"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source: { Type: CODEPIPELINE, BuildSpec: buildspec-build.yml }
      Artifacts: { Type: CODEPIPELINE }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref CodeBuildImage
        EnvironmentVariables:
          - { Name: ARTIFACT_BUCKET, Value: !Ref ArtifactBucket }
      TimeoutInMinutes: 30

  PrValidationProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AppStackPrefix}-pr"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/${RepositoryId}.git"
        BuildSpec: buildspec-pr.yml
        ReportBuildStatus: true
        Auth:
          Type: CODECONNECTIONS
          Resource: !Ref ConnectionArn
      Triggers:
        Webhook: true
        FilterGroups:
          - - { Type: EVENT, Pattern: "PULL_REQUEST_CREATED,PULL_REQUEST_UPDATED,PULL_REQUEST_REOPENED" }
            - { Type: BASE_REF, Pattern: !Sub "^refs/heads/${BranchName}$" }
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref CodeBuildImage
        EnvironmentVariables:
          - { Name: ATX_BRANCH_REGEX, Value: !Ref AtxBranchRegex }
          - { Name: ATX_TOOLS_URI, Value: !Sub "s3://${AtxFactoryBucket}/tools/atx-factory-tools.zip" }
          - { Name: ATX_PLAN_URI, Value: !Sub "s3://${AtxFactoryBucket}/plans/${RepositoryId}/latest.json" }
      TimeoutInMinutes: 30

  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: deploy-orders-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action: "lambda:*"
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackPrefix}-*"
              - Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:TagResource
                Resource: "*"
              - Effect: Allow
                Action: "dynamodb:*"
                Resource:
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackPrefix}-*"
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackPrefix}-*/stream/*"
              - Effect: Allow
                Action: [dynamodb:DescribeStream, dynamodb:ListStreams]
                Resource: "*"
              - Effect: Allow
                Action: "apigateway:*"
                Resource: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/*"
              - Effect: Allow
                Action: "events:*"
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${AppStackPrefix}-*"
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackPrefix}-*"

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketVersioning, s3:ListBucket]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
              - Effect: Allow
                Action: [codeconnections:UseConnection, codestar-connections:UseConnection]
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !GetAtt BuildProject.Arn
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackPrefix}-*/*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRole.Arn

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${AppStackPrefix}-main"
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore: { Type: S3, Location: !Ref ArtifactBucket }
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: Source
            Push:
              - Branches: { Includes: [!Ref BranchName] }
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId: { Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: "1" }
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref RepositoryId
                BranchName: !Ref BranchName
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts: [{ Name: SourceOutput }]
        - Name: Build
          Actions:
            - Name: TestAndPackage
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              Configuration: { ProjectName: !Ref BuildProject }
              InputArtifacts: [{ Name: SourceOutput }]
              OutputArtifacts: [{ Name: BuildOutput }]
        - Name: DeployDev
          Actions:
            - Name: Deploy
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CloudFormation, Version: "1" }
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub "${AppStackPrefix}-dev"
                TemplatePath: BuildOutput::packaged.yaml
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !GetAtt CloudFormationRole.Arn
                ParameterOverrides: '{"Stage": "dev"}'
              InputArtifacts: [{ Name: BuildOutput }]
        - Name: ApproveProd
          Actions:
            - Name: Approve
              ActionTypeId: { Category: Approval, Owner: AWS, Provider: Manual, Version: "1" }
              Configuration:
                CustomData: "Verify the dev stack (runtimes, /health, smoke tests) before promoting to prod."
        - Name: DeployProd
          Actions:
            - Name: Deploy
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CloudFormation, Version: "1" }
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub "${AppStackPrefix}-prod"
                TemplatePath: BuildOutput::packaged.yaml
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !GetAtt CloudFormationRole.Arn
                ParameterOverrides: '{"Stage": "prod"}'
              InputArtifacts: [{ Name: BuildOutput }]

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  PrValidationProjectName:
    Description: Make "AWS CodeBuild <region> (<this name>)" a required status check on main
    Value: !Ref PrValidationProject
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
